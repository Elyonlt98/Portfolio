<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 30 680 390" role="img" aria-labelledby="t d">
  <title id="t">Laser joining setup, schematic</title>
  <desc id="d">An industrial robot holds a diode laser head above two silicon carbide parts on a fixture. A tape-cast interlayer sits between the parts, and the laser beam is focused on the seam. The beam scans along the seam, into the page.</desc>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#15202e" stroke-width="1" opacity=".55"/>
    </pattern>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a4d" stop-opacity=".25"/>
      <stop offset="1" stop-color="#e8590c" stop-opacity=".95"/>
    </linearGradient>
    <radialGradient id="hot" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff1dc"/>
      <stop offset=".35" stop-color="#ffb26b" stop-opacity=".9"/>
      <stop offset="1" stop-color="#e8590c" stop-opacity="0"/>
    </radialGradient>
    <marker id="dot" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="5" markerHeight="5"><circle cx="4" cy="4" r="3" fill="#15202e"/></marker>
  </defs>

  <g fill="none" stroke="#15202e" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- floor line -->
    <line x1="40" y1="362" x2="640" y2="362" stroke-width="1" stroke-dasharray="2 4"/>
    <!-- fixture plate -->
    <rect x="120" y="330" width="380" height="20" fill="url(#hatch)"/>
    <line x1="150" y1="350" x2="150" y2="362"/><line x1="470" y1="350" x2="470" y2="362"/>

    <!-- SiC parts -->
    <rect x="170" y="276" width="140" height="54" fill="#3a404a"/>
    <rect x="320" y="276" width="140" height="54" fill="#3a404a"/>
    <!-- interlayer -->
    <rect x="310" y="276" width="10" height="54" fill="#f0a35e" stroke-width="1.2"/>

    <!-- robot base and arm -->
    <rect x="548" y="318" width="76" height="44" fill="#e3e8ee"/>
    <rect x="566" y="296" width="40" height="22" fill="#e3e8ee"/>
    <path d="M586 296 L548 168" stroke-width="14" stroke="#15202e"/>
    <path d="M586 296 L548 168" stroke-width="10" stroke="#e3e8ee"/>
    <path d="M548 168 L420 120" stroke-width="12" stroke="#15202e"/>
    <path d="M548 168 L420 120" stroke-width="8" stroke="#e3e8ee"/>
    <circle cx="586" cy="296" r="11" fill="#e3e8ee"/>
    <circle cx="548" cy="168" r="11" fill="#e3e8ee"/>
    <circle cx="420" cy="120" r="9" fill="#e3e8ee"/>
    <path d="M420 120 L366 128" stroke-width="6"/>
    <rect x="356" y="120" width="12" height="18" fill="#15202e"/>

    <!-- laser head -->
    <rect x="292" y="104" width="66" height="78" rx="4" fill="#e3e8ee"/>
    <line x1="300" y1="122" x2="350" y2="122" stroke-width="1"/>
    <path d="M303 182 L347 182 L333 204 L317 204 Z" fill="#e3e8ee"/>
  </g>

  <!-- beam -->
  <path class="beam" d="M318 204 L332 204 L326 276 L324 276 Z" fill="url(#beam)"/>
  <circle class="hotspot" cx="325" cy="277" r="16" fill="url(#hot)"/>

  <!-- scan direction: into page -->
  <g stroke="#15202e" stroke-width="1.4" fill="#f3f5f7">
    <circle cx="372" cy="250" r="9"/>
    <path d="M366 244 L378 256 M378 244 L366 256" fill="none"/>
  </g>

  <!-- leaders + labels -->
  <g fill="none" stroke="#15202e" stroke-width="1" marker-end="url(#dot)">
    <path d="M170 92 L230 92 L296 128"/>
    <path d="M170 196 L250 196 L321 240"/>
    <path d="M104 246 L150 246 L210 300"/>
    <path d="M176 396 L250 396 L314 318"/>
    <path d="M96 330 L112 330 L130 338"/>
    <path d="M560 62 L520 62 L488 142"/>
  </g>
  <g font-family="Archivo, Arial, sans-serif" font-size="14" fill="#15202e">
    <text x="40" y="96">Diode laser head</text>
    <text x="40" y="200">Focused beam</text>
    <text x="40" y="250">SiC part</text>
    <text x="40" y="400">Tape-cast interlayer</text>
    <text x="40" y="334">Fixture</text>
    <text x="566" y="66">Industrial robot</text>
    <text x="390" y="247">Scan along seam</text>
    <text x="390" y="263">(into page)</text>
  </g>
</svg>
